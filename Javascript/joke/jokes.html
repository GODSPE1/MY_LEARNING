<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joke Generator</title>
  <link rel="stylesheet" href="jokes.css" />
</head>
<body>
  <div class="container">
    <h1>😂 Joke Generator</h1>
    <div class="joke-box">
      <p id="joke">Click the button to get a joke!</p>
    </div>
    <button id="jokeBtn" class="start">Get Joke</button>
    <button id="stopJokeBtn" class="stop">Stop Joke</button>
  </div>

  <!-- You can add JavaScript later -->
  <script src="jokes.js"></script>
</body>
</html>
