<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="audio.js" defer></script>
    <title>Audio</title>
</head>
<body>
      <!-- adding an audio to html -->
      <div id="audio">
        <p style="margin-bottom: 3px;">Oluwatosi</p>
        <audio src="/Javascript/web-api/TKeyz-Oluwatosin.mp3" type="audio/mp3"></audio>
        
        <!-- <audio src="/TKeyz-Oluwatosin-Jesus-Is-Enough.mp3" controls></audio> -->
    </div>

    <button id="play" style="width: auto; font-size: 16px; color: #04AA6D; padding: 5px 10px; border-radius: 8px;"><i class="fa fa-play"></i></button>
    <button id="pause" style="width: auto; font-size: 16px; color: orange; padding: 5px 10px; border-radius: 8px;"><i class="fa fa-pause"></i></button>
    <button id="stop" style="width: auto; font-size: 16px; color: red; padding: 5px 10px; border-radius: 8px;"><i class="fa fa-stop"></i></button>
    <button id="step-down" style="width: auto; font-size: 16px; color: red; padding: 5px 10px; border-radius: 8px;"><i class="fa fa-backward"></i></button>
    <button id="step-up" style="width: auto; font-size: 16px; color: red; padding: 5px 10px; border-radius: 8px;"><i class="fa fa-forward"></i></button>

    <div>
        <input type="range" id="time-range" min="0" max="100" value="0" style="width: 200px;">
    </div>
    <div class="volume"><input type="range" id="volume" min="0" max="100" value="100" style="width: 200px;"></div>
    <div>
        <span type="text" id="counting-time-downwards" style="width: auto; font-size: 16px; color: blue; padding: 5px 10px; border-radius: 8px;"></span>
        <span type="text" id="counting-time-upwards" style="width: auto; font-size: 16px; color: blue; padding: 5px 10px; border-radius: 8px;"></span>
    </div>

</body>
</html>
